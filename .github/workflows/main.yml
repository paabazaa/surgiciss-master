name: Deploy Surgiciss
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - name: Prepare site folder
        run: |
          rm -rf site
          mkdir site
          echo "Copying dist/client to site"
          cp -r dist/client/* site/
          echo "Fixing _shell.html -> index.html"
          cp site/_shell.html site/index.html
          cp site/_shell.html site/404.html
          ls -lh site/ | head -20
          ls -lh site/assets/ | head -20
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
