name: Deploy Surgiciss

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache removed - you don't have package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Add SPA fallback for GitHub Pages
        run: |
          echo "=== checking dist ==="
          ls -la dist || true
          ls -la dist/client || true
          if [ -f dist/client/index.html ]; then
            echo "Using dist/client/index.html"
            cp dist/client/index.html dist/client/404.html
            cp dist/client/index.html dist/404.html
          elif [ -f dist/index.html ]; then
            echo "Using dist/index.html"
            cp dist/index.html dist/404.html
          else
            INDEX=$(find dist -name "index.html" | head -n 1)
            echo "Found $INDEX"
            cp "$INDEX" dist/404.html
            cp "$INDEX" dist/client/404.html || true
          fi
          ls -la dist/*.html || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
