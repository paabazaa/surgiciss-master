name: Deploy Surgiciss

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add SPA fallback for GitHub Pages
        run: |
          echo "=== dist structure ==="
          ls -la dist || true
          ls -la dist/client || true
          if [ -f dist/client/index.html ]; then
            echo "Found dist/client/index.html"
            cp dist/client/index.html dist/client/404.html
            cp dist/client/index.html dist/404.html
            # Keep client folder AND root 404 for SPA routing
          elif [ -f dist/index.html ]; then
            echo "Found dist/index.html"
            cp dist/index.html dist/404.html
          else
            echo "Searching for index.html"
            find dist -name "index.html"
            # fallback - try to find it
            INDEX=$(find dist -name "index.html" | head -n 1)
            if [ -n "$INDEX" ]; then
              cp "$INDEX" dist/404.html
              cp "$INDEX" dist/client/404.html || true
            else
              echo "No index.html found - failing"
              exit 1
            fi
          fi
          echo "=== done ==="
          ls -la dist/*.html || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
