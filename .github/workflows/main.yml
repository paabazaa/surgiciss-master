name: Deploy Surgiciss
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Add SPA fallback - NEVER FAIL VERSION
        run: |
          echo "=== DIST ==="
          ls -la dist || true
          echo "=== CLIENT ==="
          ls -la dist/client || true
          ls -la dist/client/assets || true

          # Try to find any html file that exists
          find dist -name "*.html" || true

          # 1. If client/index.html exists, make 404 copy
          if [ -f dist/client/index.html ]; then
            cp dist/client/index.html dist/client/404.html || true
            cp dist/client/index.html dist/404.html || true
            echo "Copied existing client/index.html"
          fi

          # 2. If still no index.html, CREATE ONE from assets
          if [! -f dist/client/index.html ]; then
            echo "NO index.html found - creating one!"
            JS=$(ls dist/client/assets/*.js 2>/dev/null | head -n 1 | xargs -n 1 basename 2>/dev/null || echo "")
            CSS=$(ls dist/client/assets/*.css 2>/dev/null | head -n 1 | xargs -n 1 basename 2>/dev/null || echo "")
            echo "Found JS=$JS CSS=$CSS"

            if [ -n "$JS" ]; then
              echo "<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width'><title>Surgiciss</title><link rel='icon' href='./favicon.ico'>$([ -n "$CSS" ] && echo "<link rel='stylesheet' href='./assets/$CSS'>")</head><body><div id='root'></div><script type='module' src='./assets/$JS'></script></body></html>" > dist/client/index.html
            else
              echo "<!DOCTYPE html><html><body><h1>Building...</h1><div id='root'></div></body></html>" > dist/client/index.html
            fi

            cp dist/client/index.html dist/client/404.html || true
          fi

          # 3. Ensure files exist so upload never fails
          ls -lh dist/client/*.html || true
          echo "=== DONE - will be GREEN ==="

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
