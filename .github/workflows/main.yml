name: Deploy Surgiciss

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: List what was built - DEBUG
        run: |
          echo "--- root ---"
          ls -la
          echo "--- dist ---"
          ls -la dist || echo "no dist"
          echo "--- dist/client ---"
          ls -la dist/client || echo "no dist/client"
          echo "---.output ---"
          ls -la.output || echo "no.output"
          echo "---.output/public ---"
          ls -la.output/public || echo "no.output/public"
          echo "--- find index.html ---"
          find. -name "index.html" -type f | head -20
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
