name: Deploy Surgiciss
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: FIX - Create index.html for GitHub Pages
        run: |
          echo "=== BEFORE ==="
          ls -la dist/client || true
          ls -la dist/client/assets | head -n 20

          JS_FILE=$(ls dist/client/assets/*.js 2>/dev/null | head -n 1)
          JS_NAME=$(basename "$JS_FILE" 2>/dev/null || echo "")
          CSS_FILE=$(ls dist/client/assets/*.css 2>/dev/null | head -n 1)
          CSS_NAME=$(basename "$CSS_FILE" 2>/dev/null || echo "")

          echo "JS: $JS_NAME CSS: $CSS_NAME"

          # ALWAYS create index.html - overwrites even if exists
          cat > dist/client/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>SURGICISS Ltd - Sterile Instrument Systems</title>
            <link rel="icon" href="/surgiciss-master/favicon.ico" />
          EOF

          if [ -n "$CSS_NAME" ]; then
            echo " <link rel=\"stylesheet\" href=\"/surgiciss-master/assets/$CSS_NAME\" />" >> dist/client/index.html
          fi

          cat >> dist/client/index.html <<EOF
          </head>
          <body>
            <div id="root"></div>
            <script type="module" src="/surgiciss-master/assets/$JS_NAME"></script>
          </body>
          </html>
          EOF

          cp dist/client/index.html dist/client/404.html
          echo "=== AFTER ==="
          ls -lh dist/client/*.html
          cat dist/client/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
